<!DOCTYPE html>
<html>
<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{title}</title>

    <style>
        .dropzone {
            background: white;
            border-radius: 5px;
            border: 2px dashed rgb(0, 135, 247);
            border-image: none;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        html {
            zoom: 100%;
        }
        * {
            box-sizing: border-box;
            -moz-box-sizing: border-box;
        }

        .pageHeader {
            position: fixed;
            top: 0mm;
        }

        .pageBody {
            /*width: 210mm;*/
        }

        .pageFooter {
            position: fixed;
            bottom: 0mm;
        }

        @page {
            size: A4 potrait;
            margin: 5mm;
        }

        @media print {
            html, body {
                /*zoom: initial;*/
                /*width: 210mm;*/
                width: 200mm;
                /*height: 297mm;*/
                height: 280mm;
                /*size: A4 potrait;*/
                /*margin: 150mm;*/
            }
        }
        @media screen {
            a[href]:after {
                display: none;
                visibility: hidden;
            }
            td{
                width: max-content;
            }
        }
        @media print {
            a[href]:after {
                display: none;
                visibility: hidden;
            }
        }

        @media print {
            div.page-break {page-break-before: always;}

            .col-print-1 {width:8%;  float:left;}
            .col-print-2 {width:16%; float:left;}
            .col-print-3 {width:25%; float:left;}
            .col-print-4 {width:33%; float:left;}
            .col-print-5 {width:42%; float:left;}
            .col-print-6 {width:50%; float:left;}
            .col-print-7 {width:58%; float:left;}
            .col-print-8 {width:66%; float:left;}
            .col-print-9 {width:75%; float:left;}
            .col-print-10{width:83%; float:left;}
            .col-print-11{width:92%; float:left;}
            .col-print-12{width:100%; float:left;}

            td,th {
                padding: 1px!important;
            }


            table.table-bordered{
                border:1px solid black !important;
                margin-top:10px !important;
            }
            table.table-bordered > thead > tr > th{
                border:1px solid black !important;
            }
            table.table-bordered > tbody > tr > td{
                border:1px solid black !important;
            }
            .table-bordered > tbody > tr > th {
                border: 1px solid black !important;
            }
        }
        @media screen {
            div.page-break {page-break-before: always;}

            .col-print-1 {width:8%;  float:left;}
            .col-print-2 {width:16%; float:left;}
            .col-print-3 {width:25%; float:left;}
            .col-print-4 {width:33%; float:left;}
            .col-print-5 {width:42%; float:left;}
            .col-print-6 {width:50%; float:left;}
            .col-print-7 {width:58%; float:left;}
            .col-print-8 {width:66%; float:left;}
            .col-print-9 {width:75%; float:left;}
            .col-print-10{width:83%; float:left;}
            .col-print-11{width:92%; float:left;}
            .col-print-12{width:100%; float:left;}

            td,th {
                padding: 1px!important;
            }

            table.table-bordered{
                border:1px solid black !important;
                margin-top:10px !important;
            }
            table.table-bordered > thead > tr > th{
                border:1px solid black !important;
            }
            table.table-bordered > tbody > tr > td{
                border:1px solid black !important;
            }
            .table-bordered > tbody > tr > th {
                border: 1px solid black !important;
            }
        }
    </style>

    <script src="{cdn_suport}AdminLTE-2.3.11/plugins/jQuery/jquery-2.2.3.min.js?v={local_version}"></script>
    <script src="{cdn_suport}bootstrap-3.3.7-dist/js/bootstrap.min.js?v={local_version}"></script>
    <script src="{cdn_suport}sweetalert2-master/dist/sweetalert2.min.js?v={local_version}"></script>
    <script src="{cdn_suport}bootstrap3-dialog-master/dist/js/bootstrap-dialog.min.js?v={local_version}"></script>
    <script src="{cdn_suport}AdminLTE-2.3.11/plugins/slimScroll/jquery.slimscroll.min.js?v={local_version}"></script>
    <script src="{cdn_suport}AdminLTE-2.3.11/dist/js/app.min.js?v={local_version}"></script>

</head>

<body class="hold-transition {skin_header} sidebar-mini" onload="" style="">


<div class="row" style="padding-left: 15px;padding-right: 15px;">
    <div class="col-print-5 col-sm-5 col-xs-5 no-paddingx">
        <img style="padding: 32px;" src="{base}assets/images/san_221iso.png" alt="images" class="img-responsive pull-right">
    </div>
    <div class="col-print-7 col-xs-7 col-sm-7 no-paddingx text-left">
        {companyProfile}
    </div>
</div>

<div class="row" style="padding-left: 15px;padding-right: 15px;">
    <div style="border-top: 4px double #000;margin-top: 10px;width:100%" class="text-center text-capitalize">
        <div class="text-bold" style="font-size: 18px;">
            {title}
        </div>
        <div class="text-bold" style="font-size: 14px;">
            No. {nomer}
        </div>
    </div>
</div>

<div class="row" style="margin-top: 25px;padding-left: 15px;padding-right: 15px;">
    <div class="col-print-12" style="border: 0px solid red;">
        {content}
    </div>
</div>

<div class="baris_sign" style="width: 100%;float: left;position: relative; min-height: 1px; padding-right: 15px; padding-left: 15px;bottom: 5px;">
    <div class="" style="width: 10%;float: left;position: relative; min-height: 1px; padding-right: 0px; padding-left: 5px;">
        &nbsp;
    </div>
    <div class="" style="width: 35%;float: left;position: relative; min-height: 1px; padding-right: 0px; padding-left: 5px;">
        {sign_1}
    </div>
    <div class="" style="width: 10%;float: left;position: relative; min-height: 1px; padding-right: 0px; padding-left: 5px;">
        &nbsp;
    </div>
    <div class="" style="width: 35%;float: left;position: relative; min-height: 1px; padding-right: 0px; padding-left: 5px;">
        {sign_2}
    </div>
</div>
